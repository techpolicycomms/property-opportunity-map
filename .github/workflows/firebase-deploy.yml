name: Deploy website to Firebase Hosting

# Requires repo secret FIREBASE_SERVICE_ACCOUNT and variable
# FIREBASE_PROJECT_ID — see docs/deployment.md §1. GitHub Pages (pages.yml)
# remains as a mirror until the custom domain is verified.

on:
  push:
    branches: [main]
    paths: [web/**, firebase.json, .github/workflows/firebase-deploy.yml]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
